<style>
  /* 色・文字・基本は assets/site.css。ここはトップだけの部分 */
  body {
    font: 300 13px/1.7 var(--mono); letter-spacing: 0.04em;
    min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto;
    padding: clamp(16px, 3.2vw, 40px);
    -webkit-font-smoothing: antialiased;
  }
  a:hover { color: inherit; }                                         /* トップの文字は、乗せても青くしない（青は音が鳴るところだけ） */
  a:focus-visible, button:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  /* 上：名前 */
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .name { font-weight: 400; font-size: 13px; letter-spacing: 0.18em; }
  .name small { color: var(--dim); font-size: 11px; letter-spacing: 0.12em; margin-left: 1.2em; }
  .read { color: var(--dim); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 中：音の線と、行き先 */
  main { display: grid; align-content: center; gap: clamp(16px, 3.2vh, 44px); padding: clamp(16px, 3vh, 48px) 0; }
  .signal { display: grid; gap: 8px; }
  canvas { display: block; width: 100%; }
  #scope { height: clamp(84px, 14vh, 170px); cursor: crosshair; touch-action: none; }   /* XY パッド：触ると曲にエフェクト（SYNTH では音が鳴る） */
  .progs { display: inline-flex; gap: 2px; flex-wrap: wrap; }
  .progs button { font: inherit; font-size: 11px; letter-spacing: 0.1em; color: var(--dim); background: none; border: 1px solid transparent; padding: 3px 7px; cursor: pointer; }
  .progs button:hover { color: var(--ink); }
  .progs button[aria-pressed="true"] { color: var(--ink); border-color: var(--line); }
  .progs .hold { margin-left: 10px; }
  .progs .hold[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  /* VJ：黒地に白。音のデータで動く縞・数字・格子 */
  .vj { position: relative; }
  #vj { height: clamp(64px, 12vh, 140px); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .readout { color: var(--dim); font-size: 11px; letter-spacing: 0.1em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .readout.on { color: var(--accent); }
  /* 曲の行：▶ は再生・停止、曲名は Bandcamp へ */
  .track { display: inline-flex; align-items: center; gap: 6px; }
  .play {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px; margin-left: -12px;              /* 指で押しやすい大きさ。▶ の位置は左端にそろえる */
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0;
  }
  .play .k { display: inline-block; width: 1.2em; text-align: center; }
  .track .t { display: inline-flex; align-items: center; min-height: 44px; }
  .track .t span { border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  .track .t:hover span, .track .t:focus-visible span { border-color: var(--ink); }
  .track .s { color: var(--dim); font-size: 11px; margin-left: 8px; }

  nav ol { list-style: none; display: grid; }
  nav li { border-top: 1px solid var(--faint); }
  nav li:last-child { border-bottom: 1px solid var(--faint); }
  nav a {
    display: grid; grid-template-columns: 52px 1fr auto; align-items: baseline; gap: 12px;
    padding: clamp(7px, 1.25vh, 14px) 0;
    min-height: 44px;                                                  /* 指で押しやすい高さ */
    font-size: clamp(22px, min(3.4vw, 4.6vh), 38px); font-weight: 300; letter-spacing: 0.06em; line-height: 1.1;
    transition: color 0.2s, padding-left 0.2s;
  }
  nav a .i, nav a .p { font-size: 11px; color: var(--dim); letter-spacing: 0.1em; }
  nav a .p { text-align: right; }
  nav a:hover, nav a:focus-visible { padding-left: 10px; }
  nav a:hover .p, nav a:focus-visible .p { color: var(--ink); }
  @media (hover: hover) { nav ol:hover a:not(:hover) { color: var(--dim); } }

  /* 作品への扉：一つだけ、小さく */
  .door { justify-self: start; color: var(--dim); font-size: 12px; display: inline-flex; gap: 12px; align-items: baseline; }
  .door b { font-weight: 400; color: var(--ink); letter-spacing: 0.14em; }
  .door:hover b { text-decoration: underline; text-underline-offset: 4px; }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 4px 16px; color: var(--dim); font-size: 11px; flex-wrap: wrap; }
  .social { display: flex; gap: 18px; }
  .social a { color: var(--dim); text-decoration: none; letter-spacing: .12em; display: inline-flex; align-items: center; min-height: 32px; border-bottom: 1px solid transparent; }
  .social a:hover, .social a:focus-visible { color: var(--ink); }

  @media (max-width: 600px) {
    nav a { grid-template-columns: 40px 1fr; }
    nav a .p { display: none; }
    .read .geo { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { nav a { transition: none; } }
</style>

<script src="assets/cursor.js"></script>
<script>
(function () {
  'use strict';
  // ---- 設定：トップで流す曲（サイト上の音源ファイルの場所）。ファイルを置いたら、ここを書き換える ----
  var TRACK_SRC = '/audio/SE-4-30sec.wav';
  var TRACK_BPM = 120;                                                  // 曲のテンポ。DELAY の間隔と LOOPER の長さが、この拍に合う

  // ---- 時計（京都の時刻） ----
  var clock = document.getElementById('clock');
  function tick() {
    try { clock.textContent = new Date().toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false }); }
    catch (e) { clock.textContent = new Date().toTimeString().slice(0, 8); }
  }
  tick(); setInterval(tick, 1000);

  // ---- 音の線：止まっているときは、ほぼ平らな線。鳴っているときは波形 ----
  var cv = document.getElementById('scope'), g = cv.getContext('2d');
  var btn = document.getElementById('play'), playK = document.getElementById('playK'), playS = document.getElementById('playS');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ctx = null, an = null, buf = null, state = 'idle', level = 0, frames = 0, A = null;
  // 音の配線（最初に押されたときに作る）
  //   曲 → [曲の音量] → FX入口 → フィルター → ビットクラッシュ → ┬→ 出口 → 解析（オシロ・VJ）→ スピーカー
  //                                                              └→ ディレイ送り → ディレイ ⇄ 帰還 → ディレイ戻り → 出口
  //   LOOPER のループ音は FX入口へ。シンセは出口へ直接
  function ensureCtx() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return !!an; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC(); an = ctx.createAnalyser(); an.fftSize = 2048; buf = new Float32Array(an.fftSize);
      A = {};
      A.master = ctx.createGain(); A.master.connect(an); an.connect(ctx.destination);
      A.music = ctx.createGain(); A.fxIn = ctx.createGain(); A.music.connect(A.fxIn);
      A.filt = ctx.createBiquadFilter(); A.filt.type = 'lowpass'; A.filt.frequency.value = 20000; A.filt.Q.value = 0.0001;
      A.crush = ctx.createWaveShaper(); A.post = ctx.createGain();
      A.fxIn.connect(A.filt); A.filt.connect(A.crush); A.crush.connect(A.post); A.post.connect(A.master);
      A.send = ctx.createGain(); A.send.gain.value = 0; A.dly = ctx.createDelay(2); A.fb = ctx.createGain(); A.fb.gain.value = 0; A.wet = ctx.createGain(); A.wet.gain.value = 0.7;
      A.post.connect(A.send); A.send.connect(A.dly); A.dly.connect(A.fb); A.fb.connect(A.dly); A.dly.connect(A.wet); A.wet.connect(A.master);
    } catch (e) { ctx = null; an = null; A = null; }
    return !!an;
  }

  function size() {
    var d = Math.min(2, window.devicePixelRatio || 1), r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));
  }
  size(); window.addEventListener('resize', size);

  function draw(now) {
    frames++;
    var w = cv.width, h = cv.height, mid = h / 2, ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#e6e6e3';
    g.clearRect(0, 0, w, h);
    g.strokeStyle = ink; g.lineWidth = Math.max(1, w / 1400);
    g.beginPath();
    var n = 512, sum = 0;
    if (an && (state === 'playing' || syn.sounding)) {
      an.getFloatTimeDomainData(buf);
      var span = buf.length / 2, z = 0;                                  // トリガー：最初の「下から上へ0を横切る点」から描く（波形が止まって見える）
      for (var q = 1; q < span; q++) { if (buf[q - 1] < 0 && buf[q] >= 0) { z = q; break; } }
      for (var i = 0; i < n; i++) {
        var v = buf[z + Math.floor(i / n * span)]; sum += v * v;
        var x = i / (n - 1) * w, y = mid - Math.max(-1, Math.min(1, v * 1.6)) * mid * 0.92;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      level = Math.sqrt(sum / n);
    } else {
      var t = (now || 0) / 1000;
      for (var j = 0; j < n; j++) {
        var nz = reduce ? 0 : (Math.sin(j * 1.7 + t * 3.1) * Math.sin(j * 0.31 - t * 1.3)) * 0.6;   // かすかなノイズ
        var xx = j / (n - 1) * w, yy = mid + nz * (h / 140);
        j ? g.lineTo(xx, yy) : g.moveTo(xx, yy);
      }
      level = 0;
    }
    g.stroke();
    // 目盛り：左右の端に小さく
    g.fillStyle = ink; g.globalAlpha = 0.35;
    g.fillRect(0, mid - h * 0.08, Math.max(1, w / 1400), h * 0.16); g.fillRect(w - Math.max(1, w / 1400), mid - h * 0.08, Math.max(1, w / 1400), h * 0.16);
    if (pad.prog !== 'SYNTH') {                                         // パッドの格子（4×4）
      g.globalAlpha = 0.12; for (var gx2 = 1; gx2 < 4; gx2++) g.fillRect(gx2 / 4 * w, 0, 1, h); for (var gy2 = 1; gy2 < 4; gy2++) g.fillRect(0, gy2 / 4 * h, w, 1);
      if (pad.active) { var acc2 = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(); g.fillStyle = acc2; g.globalAlpha = 0.9; g.fillRect(pad.x * w - 1, 0, 2, h); g.fillRect(0, pad.y * h - 1, w, 2); g.fillStyle = ink; }   // かけている位置（HOLD 中も残る）
    }
    if (syn.px !== null && pad.prog === 'SYNTH') { g.globalAlpha = 0.6; g.fillRect(syn.px * w - 1, 0, 2, h * 0.06); g.fillRect(syn.px * w - 1, h * 0.94, 2, h * 0.06); }   // 押している位置の目印
    g.globalAlpha = 1;
    if (!reduce || state === 'playing' || syn.sounding || pad.active) requestAnimationFrame(draw); else drawing = false;
  }
  var drawing = true;
  requestAnimationFrame(draw);
  function kick() { if (!drawing) { drawing = true; requestAnimationFrame(draw); } }

  function setState(s, label) {
    state = s;
    playK.textContent = s === 'playing' ? '■' : '▶';
    btn.setAttribute('aria-pressed', s === 'playing' ? 'true' : 'false');
    btn.setAttribute('aria-label', s === 'playing' ? '騒がしい孤独 を停止' : '騒がしい孤独 を再生');
    playS.textContent = label || 'EP, 2025';
    if (s === 'playing') kick();
  }

  // 曲：一度メモリに読み込んでから鳴らす（LOOPER がその瞬間の音を正確にループできるように）
  var T = { buf: null, loading: null, src: null, startedAt: 0, offset: 0 };
  function loadTrack() {
    if (T.buf) return Promise.resolve(T.buf);
    if (T.loading) return T.loading;
    T.loading = fetch(TRACK_SRC).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(function (ab) { return new Promise(function (res, rej) { var p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); }); })
      .then(function (b) { T.buf = b; return b; })
      .catch(function (e) { T.loading = null; throw e; });
    return T.loading;
  }
  function trackPos() { return T.buf ? ((ctx.currentTime - T.startedAt) % T.buf.duration + T.buf.duration) % T.buf.duration : 0; }
  function playTrack() {
    if (!ensureCtx()) { setState('nosignal', 'NO SIGNAL'); return Promise.resolve(false); }
    if (state === 'playing') return Promise.resolve(true);
    setState('loading', 'LOADING');
    return loadTrack().then(function (b) {
      var src = ctx.createBufferSource(); src.buffer = b; src.loop = true; src.connect(A.music);   // 曲は繰り返し流れる（パッドで遊んでいる途中で止まらない）
      var off = T.offset % b.duration;
      src.start(0, off); T.startedAt = ctx.currentTime - off; T.src = src;
      src.onended = function () { if (T.src === src) { T.src = null; T.offset = 0; padRelease(true); setState('idle'); } };
      setState('playing', 'EP, 2025');
      return true;
    }).catch(function () { setState('nosignal', 'NO SIGNAL'); return false; });   // 音源ファイルが見つからないとき
  }
  function stopTrack() {
    if (T.src) { T.offset = trackPos(); var s0 = T.src; T.src = null; s0.onended = null; try { s0.stop(); } catch (e) {} }
    padRelease(true);
    setState('idle');
  }
  btn.addEventListener('click', function () { if (state === 'playing') stopTrack(); else playTrack(); });

  // ---- シンセ：線を押すと鳴る ----
  // 2つのノコギリ波（少しずらして厚みを出す）→ ローパスフィルター → 音量の山（押すと立ち上がり、離すと減衰）
  var SCALE = [0, 3, 5, 7, 10], ROOT = 110;                              // A のマイナー・ペンタトニック。A2 から2オクターブ
  var NOTES = []; for (var o = 0; o < 2; o++) SCALE.forEach(function (d) { NOTES.push(o * 12 + d); }); NOTES.push(24);
  var NAMES = ['A', 'A#', 'B', 'C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#'];
  var syn = { voice: null, sounding: false, gate: false, px: null, note: -1, cutoff: 0, offTimer: 0 };
  var readout = document.getElementById('readout');
  function voice() {
    if (syn.voice || !ensureCtx()) return syn.voice;
    var o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), f = ctx.createBiquadFilter(), env = ctx.createGain(), out = ctx.createGain();
    o1.type = o2.type = 'sawtooth'; o2.detune.value = 7;
    f.type = 'lowpass'; f.Q.value = 6; f.frequency.value = 1200;
    env.gain.value = 0; out.gain.value = 0.16;                           // 小さめの音量
    o1.connect(f); o2.connect(f); f.connect(env); env.connect(out); out.connect(A.master);
    o1.start(); o2.start();
    syn.voice = { o1: o1, o2: o2, f: f, env: env };
    return syn.voice;
  }
  function noteLabel(semi) { return noteName(semi) + ' ' + (ROOT * Math.pow(2, semi / 12)).toFixed(1) + 'Hz'; }
  function noteName(semi) { return NAMES[(semi % 12 + 12) % 12] + (2 + Math.floor((semi + 9) / 12)); }
  function setNote(i, bright) {                                          // i：音階の何番目か、bright：0〜1（音色の明るさ）
    var v = voice(); if (!v) return;
    var semi = NOTES[Math.max(0, Math.min(NOTES.length - 1, i))], hz = ROOT * Math.pow(2, semi / 12), now = ctx.currentTime;
    var cut = 300 * Math.pow(2, Math.max(0, Math.min(1, bright)) * 5);
    v.o1.frequency.setTargetAtTime(hz, now, syn.gate ? 0.012 : 0.001);     // 押したまま動かすと、なめらかに移る
    v.o2.frequency.setTargetAtTime(hz, now, syn.gate ? 0.012 : 0.001);
    v.f.frequency.setTargetAtTime(cut, now, 0.02);
    syn.note = semi; syn.hz = hz; syn.cutoff = cut;
    readout.textContent = noteName(semi) + '  ' + hz.toFixed(1) + ' Hz  LPF ' + (cut >= 1000 ? (cut / 1000).toFixed(1) + 'k' : Math.round(cut));
  }
  function gateOn() {
    var v = voice(); if (!v) return;
    var now = ctx.currentTime;
    clearTimeout(syn.offTimer);
    v.env.gain.cancelScheduledValues(now); v.env.gain.setValueAtTime(v.env.gain.value, now);
    v.env.gain.linearRampToValueAtTime(1, now + 0.006);                 // 立ち上がり 6ms
    v.env.gain.setTargetAtTime(0.7, now + 0.006, 0.15);                 // 少し落ち着く
    syn.gate = true; syn.sounding = true; readout.classList.add('on'); kick();
  }
  function gateOff() {
    if (!syn.voice) return;
    var v = syn.voice, now = ctx.currentTime;
    v.env.gain.cancelScheduledValues(now); v.env.gain.setValueAtTime(v.env.gain.value, now);
    v.env.gain.setTargetAtTime(0, now, 0.12);                           // 離すと減衰
    syn.gate = false; syn.px = null;
    clearTimeout(syn.offTimer);
    syn.offTimer = setTimeout(function () { if (!syn.gate) { syn.sounding = false; readout.classList.remove('on'); readout.textContent = idleText(); } }, 700);
  }
  // マウス・タッチ：左右で音の高さ、上下で明るさ（上ほど明るい）
  function fromPointer(e) {
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    x = Math.max(0, Math.min(0.9999, x)); syn.px = x;
    setNote(Math.floor(x * NOTES.length), 1 - Math.max(0, Math.min(1, y)));
  }
  // ---- XY パッド（エフェクト）：触っている間だけ曲にかかる。HOLD ならかけたまま ----
  var PROGS = ['FILTER', 'DELAY', 'LOOPER', 'CRUSH', 'SYNTH'];
