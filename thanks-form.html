<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ完了 — 武田 鳴</title>
<meta name="description" content="お問い合わせを受け付けました">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main class="notice">
  <div class="notice__box">
    <div class="notice__id">武田 鳴 / CONTACT</div>
    <h1 class="notice__title">お問い合わせ完了</h1>
    <p class="notice__lead">お問い合わせをお送りいただき、<br>ありがとうございます。</p>

    <article class="card" id="contactDetails">
      <div class="card__meta"><span class="card__tag">RECEIVED</span><span class="card__title">受付完了</span><span></span></div>
      <!-- 問い合わせフォームから渡された内容（あれば）。無ければ出さない -->
      <div class="spec" id="contactSpec" hidden></div>
      <div class="card__body">
        <p class="text-jp">お問い合わせ内容を確認いたします。<br>通常1-2営業日以内にご返信いたします。</p>
      </div>
    </article>

    <article class="card">
      <div class="card__meta"><span class="card__tag">NEXT</span><span class="card__title">今後の流れ</span><span></span></div>
      <div class="card__body">
        <p class="text-jp">内容を確認次第、メールにてご返信いたします。<br>お急ぎの場合は、直接メールまたはSNSでお問い合わせください。<br>引き続き、武田 鳴をよろしくお願いいたします。</p>
      </div>
    </article>

    <div class="notice__redirect">
      <span><span class="notice__count" id="countdown">10</span> 秒後に公式サイトへ移動します</span>
      <a class="btn btn--quiet" href="https://takeda-mei.com">今すぐ移動する</a>
    </div>
  </div>
</main>

<script src="assets/cursor.js"></script>
<script>
(function () {
  'use strict';
  var SECONDS = 10;
  var HOME = 'https://takeda-mei.com';
  var countdown = SECONDS;
  var el = document.getElementById('countdown');
  el.textContent = countdown;
  var timer = setInterval(function () {
    countdown--;
    el.textContent = countdown;
    if (countdown <= 0) { clearInterval(timer); window.location.href = HOME; }
  }, 1000);

  // URL パラメータの名前・連絡先・件名を出す。
  // URL の値は誰でも書き換えられるので、HTML としてではなく文字として入れる（textContent）
  var params = new URLSearchParams(window.location.search);
  var rows = [['NAME', params.get('name')], ['CONTACT', params.get('email')], ['SUBJECT', params.get('subject')]].filter(function (r) { return r[1]; });
  if (rows.length) {
    var spec = document.getElementById('contactSpec');
    rows.forEach(function (r) {
      var row = document.createElement('div'); row.className = 'spec__row';
      var k = document.createElement('span'); k.className = 'spec__k'; k.textContent = r[0];
      var v = document.createElement('span'); v.className = 'spec__v'; v.textContent = r[1];
      row.appendChild(k); row.appendChild(v); row.appendChild(document.createElement('span'));
      spec.appendChild(row);
    });
    spec.hidden = false;
  }

  // アクセシビリティのためのフォーカス管理
  document.body.setAttribute('tabindex', '-1');
  document.body.focus();

  // Esc ですぐ移動
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { clearInterval(timer); window.location.href = HOME; }
  });
})();
</script>
</body>
</html>
